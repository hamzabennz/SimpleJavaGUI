name: Stars Bot Overlay APK

on:
  push:
    paths:
      - "soccer-stars-overlay/**"
      - ".github/workflows/overlay-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soccer-stars-overlay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test core (physics / AI / vision parity with the Python bot)
        run: ./gradlew :core:test --stacktrace

      - name: Build APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk stars-bot-overlay.apk

      - uses: actions/upload-artifact@v4
        with:
          name: stars-bot-overlay-apk
          path: soccer-stars-overlay/stars-bot-overlay.apk

      - name: Publish to the "overlay-latest" pre-release (easy download on the phone)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: overlay-latest
          name: Stars Bot Overlay (latest build)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Android overlay port of Soccer-Stars-Game-Bot, built from ${{ github.ref_name }} @ ${{ github.sha }}.
            Download `stars-bot-overlay.apk` on your phone and install it (allow "install unknown apps").
          files: soccer-stars-overlay/stars-bot-overlay.apk
